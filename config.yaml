# ===========================================================================
# Amazon ML Challenge 2026 - Business Entity Resolution Configuration
# ===========================================================================
# Central config: every script reads from this file — no magic numbers in code.

random_state: 42

# ---------------------------------------------------------------------------
# Data splits (entity-grouped by S1 ID)
# ---------------------------------------------------------------------------
splits:
  val_frac: 0.15
  holdout_frac: 0.10
  # train = 1 - val_frac - holdout_frac = 0.75

# ---------------------------------------------------------------------------
# Blocking / Candidate Generation
# ---------------------------------------------------------------------------
blocking:
  active_blocks: ["A", "B", "C", "D"]
  rare_token_percentile: 25
  ann_neighbors: 10
  ann_max_distance: 0.5
  enable_pruning: true
  max_candidates_before_pruning: 50
  prune_top_k: 20

# ---------------------------------------------------------------------------
# Feature Engineering
# ---------------------------------------------------------------------------
features:
  tfidf_name:
    analyzer: "char_wb"
    ngram_range: [2, 4]
    max_df: 0.9
    min_df: 2
  tfidf_addr:
    analyzer: "char_wb"
    ngram_range: [2, 4]
    max_df: 0.9
    min_df: 2

# ---------------------------------------------------------------------------
# LightGBM Hyperparameters
# ---------------------------------------------------------------------------
lightgbm:
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  is_unbalance: true      # tunable: validate against val macro F0.5
  n_jobs: -1
  verbose: -1

# ---------------------------------------------------------------------------
# Threshold / Decision Layer
# ---------------------------------------------------------------------------
threshold:
  grid_min: 0.30
  grid_max: 0.95
  grid_step: 0.025
  # Two-band decision: t_high = confident match, t_low = confident non-match
  # Borderline band [t_low, t_high] defaults to non-match (precision-heavy F0.5)
  default_t_high: 0.70
  default_t_low: 0.40

# ---------------------------------------------------------------------------
# Hard Negative Mining
# ---------------------------------------------------------------------------
hard_negatives:
  top_k_per_s1: 5
  min_name_sim: 0.3        # only consider negatives above this similarity

# ---------------------------------------------------------------------------
# Experiment Logging
# ---------------------------------------------------------------------------
experiment_log: "experiments/experiment_log.csv"
